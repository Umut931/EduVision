<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>EduVision Screen</title>
    <style>
        body{
            margin:0;
            background:black;
            color:white;
            font-family:sans-serif;
            display:flex;
            align-items:center;
            justify-content:center;
            height:100vh;
            overflow: hidden;
        }
        #media-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video, img, iframe {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        #no-media {
            text-align: center;
            color: #666;
        }
        #status {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 0.8em;
            color: #999;
            background: rgba(0,0,0,0.8);
            padding: 5px 10px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="media-container">
        <div id="no-media">Chargement...</div>
    </div>
    <div id="status">Chargement...</div>

    <script src="http://192.168.0.105:3000/socket.io/socket.io.js"></script>
    <script>
        const SERVER_URL = 'http://192.168.0.105:3000';
        // Redirige les fetch() relatifs vers le serveur distant
        const _originalFetch = window.fetch.bind(window);
        window.fetch = function(input, init) {
            if (typeof input === 'string' && input.startsWith('/')) {
                input = SERVER_URL + input;
            }
            return _originalFetch(input, init);
        };
    </script>
    <script>
        const pathParts = window.location.pathname.split('/');
        const screenId = pathParts[pathParts.length - 1] || 'unknown';
        const baseUrl = window.location.protocol + '//' + window.location.host;
        document.title = 'EduVision Screen ' + screenId;

        let currentIndex = 0;
        let medias = [];
        let mediaInterval;
        let horlogeInterval;
        let currentDisplayPage = 'documents';
        let socket = null;

        // Variables pour la synchronisation PDF
        let currentPdfFile = null;
        let currentPdfPage = 1;
        let totalPdfPages = 0;
        let pdfZoomLevel = 100;

        // Annotations PDF : canvas overlay temps réel
        let annotationCanvas = null;
        let annotationCtx = null;
        let isReceivingStroke = false;
        let prevStrokeX = 0, prevStrokeY = 0;
        let drawPointCount = 0;

        function stopMediaRotation() {
            if (mediaInterval) {
                clearTimeout(mediaInterval);
                mediaInterval = null;
            }
        }

        function renderDisplayPage(page) {
            currentDisplayPage = page || 'documents';
            const status = document.getElementById('status');
            if (status) {
                status.textContent = 'ID: ' + screenId + ' | page: ' + currentDisplayPage;
            }
            if (horlogeInterval) {
                clearInterval(horlogeInterval);
                horlogeInterval = null;
            }

            if (currentDisplayPage === 'meteo') {
                stopMediaRotation();
                renderMeteoPage();
                return;
            }

            if (currentDisplayPage === 'pronote') {
                stopMediaRotation();
                renderPronotePage();
                return;
            }

            if (currentDisplayPage === 'horloge') {
                stopMediaRotation();
                renderHorlogePage();
                return;
            }

            if (currentDisplayPage === 'camera') {
                stopMediaRotation();
                renderCameraPage();
                return;
            }

            if (currentDisplayPage === 'events') {
                stopMediaRotation();
                renderEventsPage();
                return;
            }

            if (currentDisplayPage === 'sensors') {
                stopMediaRotation();
                renderSensorsPage();
                return;
            }

            // Si on a un PDF synchronisé, l'afficher au lieu de la rotation de médias
            if (currentDisplayPage === 'documents' && currentPdfFile) {
                stopMediaRotation();
                renderPdfPage(currentPdfFile, currentPdfPage);
                return;
            }

            if (medias.length === 0) {
                document.getElementById('media-container').innerHTML = '<div id="no-media">Aucun média sélectionné</div>';
                return;
            }

            currentIndex = Math.min(currentIndex, medias.length - 1);
            afficherMedia(currentIndex);
            scheduleNextMedia();
        }

        function renderMeteoPage() {
            const container = document.getElementById('media-container');
            container.innerHTML = '<div style="color: white; text-align:center; width:100%; padding: 20px;">Chargement de la météo...</div>';
            fetch('/api/meteo')
                .then(res => res.json())
                .then(data => {
                    if (!data.success) {
                        container.innerHTML = '<div style="color:white; text-align:center; padding:20px;">Erreur météo : ' + (data.message || 'Données non disponibles') + '</div>';
                        return;
                    }
                    const d = data.data || {};
                    const getIcon = (c) => {
                        const t = (c || '').toLowerCase();
                        if (t.includes('soleil') || t.includes('sunny') || t.includes('clear')) return '☀️';
                        if (t.includes('pluie') || t.includes('rain') || t.includes('drizzle')) return '🌧️';
                        if (t.includes('neige') || t.includes('snow')) return '❄️';
                        if (t.includes('orage') || t.includes('storm') || t.includes('thunder')) return '⛈️';
                        if (t.includes('nuage') || t.includes('cloud') || t.includes('overcast')) return '☁️';
                        return '🌤️';
                    };
                    container.innerHTML = '<div style="padding:40px; color:white; text-align:center; width:100%; box-sizing:border-box;">' +
                        '<div style="font-size:2em; margin-bottom:10px;">' + getIcon(d.condition) + ' ' + (d.ville || 'Paris') + '</div>' +
                        '<div style="font-size:5em; font-weight:700; line-height:1;">' + d.temperature + '°C</div>' +
                        '<div style="margin-top:10px; font-size:1.3em; opacity:0.8;">Ressenti ' + d.ressenti + '°C — ' + (d.condition || '') + '</div>' +
                        '<div style="display:flex; justify-content:center; gap:30px; flex-wrap:wrap; margin-top:30px; font-size:1.1em;">' +
                        '<div>💧 ' + d.humidite + '%</div>' +
                        '<div>💨 ' + d.vent + ' km/h</div>' +
                        '<div>👁️ ' + d.visibilite + ' km</div>' +
                        '</div>' +
                        '</div>';
                })
                .catch(err => {
                    container.innerHTML = '<div style="color:white; text-align:center; padding:20px;">Erreur météo : ' + err.message + '</div>';
                });
        }

        function renderPronotePage() {
            const container = document.getElementById('media-container');
            container.innerHTML = '<div style="color: white; text-align:center; width:100%; padding: 20px;">Chargement de l\'emploi du temps...</div>';
            fetch('/api/pronote')
                .then(res => res.json())
                .then(data => {
                    if (!data.success) {
                        container.innerHTML = '<div style="color:white; text-align:center; padding:20px;">Erreur Pronote : ' + (data.message || 'Données non disponibles') + '</div>';
                        return;
                    }
                    const edt = data.data || {};
                    const cours = Array.isArray(edt.cours) ? edt.cours : [];
                    if (cours.length === 0) {
                        container.innerHTML = '<div style="padding: 20px; color:white; text-align:center;"><h2>' + (edt.jour || '') + ' ' + (edt.date || '') + '</h2><p>Aucun cours trouvé.</p></div>';
                        return;
                    }

                    let html = '<div style="padding: 20px; color: white;">' +
                        '<h2 style="text-align:center; margin-bottom: 20px;">📅 ' + (edt.jour || '') + ' ' + (edt.date || '') + '</h2>' +
                        '<div style="display: grid; gap: 16px; max-width: 1000px; margin: 0 auto;">';

                    cours.forEach(c => {
                        html += '<div style="border: 1px solid rgba(255,255,255,0.2); padding: 16px; border-radius: 12px; background: rgba(0,0,0,0.35);">' +
                            '<div style="font-size: 1.3em; font-weight: 700; margin-bottom: 8px;">' + (c.matiere || c.summary || 'Cours') + '</div>' +
                            '<div style="display:flex; flex-wrap: wrap; gap: 12px; font-size: 0.95em;">' +
                            '<span>🕐 ' + (c.heure || c.time || '—') + '</span>' +
                            '<span>📍 ' + (c.salle || c.location || '—') + '</span>' +
                            '<span>👨‍🏫 ' + (c.professeur || c.teacher || '—') + '</span>' +
                            '</div>' +
                            '</div>';
                    });

                    html += '</div></div>';
                    container.innerHTML = html;
                })
                .catch(err => {
                    container.innerHTML = '<div style="color:white; text-align:center; padding:20px;">Erreur Pronote : ' + err.message + '</div>';
                });
        }

        function renderHorlogePage() {
            const container = document.getElementById('media-container');
            container.innerHTML = '<div style="color: white; display: flex; align-items: center; justify-content: center; height: 100%; width: 100%;"><div style="text-align: center;"><div id="raspi-clock" style="font-size: 8vw; font-weight: 700; line-height: 1;">--:--:--</div><div id="raspi-clock-date" style="margin-top: 16px; font-size: 2vw; opacity: 0.8;"></div></div></div>';
            if (horlogeInterval) {
                clearInterval(horlogeInterval);
                horlogeInterval = null;
            }
            updateClock();
            horlogeInterval = setInterval(updateClock, 1000);
        }

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const clock = document.getElementById('raspi-clock');
            const date = document.getElementById('raspi-clock-date');
            if (clock) clock.textContent = hours + ':' + minutes + ':' + seconds;
            if (date) date.textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }

        function renderCameraPage() {
            document.getElementById('media-container').innerHTML = '<iframe src="' + SERVER_URL + '/camera-page.html" style="width:100%; height:100%; border:none;"></iframe>';
        }

        function renderSensorsPage() {
            const container = document.getElementById('media-container');
            container.innerHTML = '<div style="color:white;text-align:center;padding:20px;">Chargement des capteurs...</div>';
            fetch('/api/sensors')
                .then(res => res.json())
                .then(res => {
                    const d = res.data || {};
                    const getQualite = (val) => {
                        if (val === null || val === undefined) return { label: '—', color: '#aaa' };
                        if (val < 50)  return { label: 'Excellente', color: '#27ae60' };
                        if (val < 100) return { label: 'Bonne',      color: '#2ecc71' };
                        if (val < 150) return { label: 'Moyenne',    color: '#f39c12' };
                        if (val < 200) return { label: 'Mauvaise',   color: '#e67e22' };
                        return { label: 'Très mauvaise', color: '#e74c3c' };
                    };
                    const q = getQualite(d.air_quality);
                    const temp = d.temperature != null ? d.temperature + '°C' : '—';
                    const hum  = d.humidity    != null ? d.humidity    + '%'  : '—';
                    const mouv = d.motion ? '🔴 Mouvement détecté' : '🟢 Aucun mouvement';
                    container.innerHTML =
                        '<div style="padding:40px;color:white;width:100%;box-sizing:border-box;">' +
                        '<h2 style="text-align:center;font-size:2.5em;margin-bottom:40px;">📡 Capteurs de la salle</h2>' +
                        '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:24px;max-width:900px;margin:0 auto;">' +
                        '<div style="background:rgba(255,255,255,0.08);border-radius:16px;padding:40px;text-align:center;">' +
                            '<div style="font-size:3.5em;">🌡️</div>' +
                            '<div style="font-size:3em;font-weight:700;margin-top:10px;">' + temp + '</div>' +
                            '<div style="opacity:0.7;margin-top:8px;font-size:1.1em;">Température</div>' +
                        '</div>' +
                        '<div style="background:rgba(255,255,255,0.08);border-radius:16px;padding:40px;text-align:center;">' +
                            '<div style="font-size:3.5em;">💧</div>' +
                            '<div style="font-size:3em;font-weight:700;margin-top:10px;">' + hum + '</div>' +
                            '<div style="opacity:0.7;margin-top:8px;font-size:1.1em;">Humidité</div>' +
                        '</div>' +
                        '<div style="background:rgba(255,255,255,0.08);border-radius:16px;padding:40px;text-align:center;">' +
                            '<div style="font-size:3.5em;">🌬️</div>' +
                            '<div style="font-size:2em;font-weight:700;margin-top:10px;color:' + q.color + ';">' + q.label + '</div>' +
                            '<div style="opacity:0.7;margin-top:8px;font-size:1.1em;">Qualité de l\'air' + (d.air_quality != null ? ' (' + d.air_quality + ')' : '') + '</div>' +
                        '</div>' +
                        '<div style="background:rgba(255,255,255,0.08);border-radius:16px;padding:40px;text-align:center;">' +
                            '<div style="font-size:3.5em;">👁️</div>' +
                            '<div style="font-size:1.5em;font-weight:700;margin-top:10px;">' + mouv + '</div>' +
                            '<div style="opacity:0.7;margin-top:8px;font-size:1.1em;">Détection</div>' +
                        '</div>' +
                        '</div></div>';
                })
                .catch(() => {
                    container.innerHTML = '<div style="color:white;text-align:center;padding:40px;">❌ Erreur lecture des capteurs</div>';
                });
        }

        function renderEventsPage() {
            const container = document.getElementById('media-container');
            container.innerHTML = '<div style="color:white; text-align:center; padding:20px;">Chargement des événements...</div>';
            fetch('/api/ics-events')
                .then(res => res.json())
                .then(data => {
                    if (!data.success || !data.events.length) {
                        container.innerHTML = '<div style="color:white; display:flex; align-items:center; justify-content:center; height:100%; font-size:2em;">Aucun événement à venir.</div>';
                        return;
                    }
                    let html = '<div style="padding:40px; color:white; width:100%; box-sizing:border-box;">' +
                        '<h2 style="text-align:center; font-size:2.5em; margin-bottom:40px;">📅 Événements de l\'établissement</h2>' +
                        '<div style="display:grid; gap:24px; max-width:900px; margin:0 auto;">';
                    data.events.forEach(e => {
                        const d = new Date(e.dtstart);
                        const dateStr = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
                        const timeStr = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                        html += '<div style="border:1px solid rgba(255,255,255,0.2); padding:24px; border-radius:16px; background:rgba(0,0,0,0.4);">' +
                            '<div style="font-size:1.5em; font-weight:700; margin-bottom:8px;">' + e.summary + '</div>' +
                            '<div style="color:#7ecfff; font-size:1.1em;">' + dateStr + ' à ' + timeStr + '</div>' +
                            (e.location ? '<div style="margin-top:6px; color:#aaa;">📍 ' + e.location + '</div>' : '') +
                            '</div>';
                    });
                    html += '</div></div>';
                    container.innerHTML = html;
                })
                .catch(() => {
                    container.innerHTML = '<div style="color:white; text-align:center; padding:20px;">Erreur chargement événements.</div>';
                });
        }

        function getOrCreateAnnotationCanvas() {
            if (!annotationCanvas) {
                annotationCanvas = document.createElement('canvas');
                annotationCanvas.style.cssText = 'position:fixed;top:0;left:0;pointer-events:none;z-index:9999;';
                annotationCanvas.width = window.innerWidth;
                annotationCanvas.height = window.innerHeight;
                document.body.appendChild(annotationCanvas);
                annotationCtx = annotationCanvas.getContext('2d');
                annotationCtx.lineCap = 'round';
                annotationCtx.lineJoin = 'round';
                console.log('✅ [CLIENT] Canvas annotation créé', annotationCanvas.width, 'x', annotationCanvas.height);
            }
            return annotationCanvas;
        }

        function clearAnnotationOverlay() {
            if (annotationCtx && annotationCanvas) {
                annotationCtx.clearRect(0, 0, annotationCanvas.width, annotationCanvas.height);
            }
            isReceivingStroke = false;
        }

        // Retourne le rect de la zone PDF réelle, sans CSS transform (stable à tout zoom)
        function getPdfRect() {
            // Préférer pdf-inner-container (pas de CSS transform) plutôt que l'iframe
            // qui peut avoir transform:scale() appliqué pour le zoom — getBoundingClientRect
            // inclurait ce scale et donnerait des coords visuelles incorrectes
            const inner = document.getElementById('pdf-inner-container');
            if (inner) {
                const r = inner.getBoundingClientRect();
                if (r.width > 10 && r.height > 10) return r;
            }
            const iframe = document.getElementById('pdf-iframe');
            if (iframe) {
                // Lire les dimensions layout (sans transform) via offsetWidth/offsetHeight
                const rect = iframe.getBoundingClientRect();
                // Si scale != 1, getBoundingClientRect est la zone visuelle transformée
                // On préfère les dimensions du container parent dans ce cas
                if (rect.width > 10 && rect.height > 10) return rect;
            }
            return { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
        }

        // Redimensionne le canvas d'annotation lors d'un resize de la fenêtre
        window.addEventListener('resize', () => {
            if (annotationCanvas) {
                // Sauvegarder le contenu actuel
                const imageData = annotationCtx.getImageData(0, 0, annotationCanvas.width, annotationCanvas.height);
                annotationCanvas.width = window.innerWidth;
                annotationCanvas.height = window.innerHeight;
                annotationCtx.lineCap = 'round';
                annotationCtx.lineJoin = 'round';
                annotationCtx.putImageData(imageData, 0, 0);
            }
        });

        function renderPdfPage(file, page) {
            if (!file) {
                document.getElementById('media-container').innerHTML = '<div id="no-media" style="color: #999; text-align: center;">Aucun PDF sélectionné</div>';
                return;
            }

            const container = document.getElementById('media-container');
            // Ajouter un timestamp pour forcer le rechargement du PDF
            const timestamp = Date.now();
            const pdfUrl = `${SERVER_URL}/api/fichiers/lecture/${encodeURIComponent(file)}?t=${timestamp}#page=${page}&zoom=${pdfZoomLevel}`;
            
            // Créer l'interface PDF complète avec contrôles
            container.innerHTML = `
                <div style="width: 100%; height: 100%; display: flex; flex-direction: column; background: #1a1a1a; color: white;">
                    <!-- En-tête PDF -->
                    <div style="background: #0a0a0a; padding: 15px; border-bottom: 2px solid #28a745; text-align: center;">
                        <div style="font-size: 1.2em; font-weight: bold;">📄 ${file}</div>
                        <div style="font-size: 0.9em; color: #999; margin-top: 5px;">Page ${page}/${totalPdfPages}</div>
                    </div>
                    
                    <!-- Zone d'affichage PDF -->
                    <div style="flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; background: #2a2a2a; padding: 20px; position: relative;">
                        <div id="pdf-inner-container" style="position: relative; width: 100%; height: 100%;">
                            <iframe id="pdf-iframe" src="${pdfUrl}"
                                    style="width: 100%; height: 100%; border: none; transform: scale(${pdfZoomLevel / 100}); transform-origin: top center;"
                                    type="application/pdf">
                            </iframe>
                            <!-- L'overlay d'annotations est un <img> injecté dynamiquement par showAnnotationOverlay() -->
                        </div>
                    </div>
                    
                    <!-- Barre d'outils inférieure -->
                    <div style="background: #0a0a0a; padding: 15px; border-top: 2px solid #28a745; display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap;">
                        <!-- Contrôles de zoom -->
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <button style="background: #667eea; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9em;" onclick="clientPdfZoomOut()">🔍− Zoom−</button>
                            <span style="min-width: 60px; text-align: center; font-weight: bold;" id="client-zoom-level">${pdfZoomLevel}%</span>
                            <button style="background: #667eea; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9em;" onclick="clientPdfZoomIn()">Zoom+ 🔍</button>
                            <button style="background: #6c757d; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9em;" onclick="clientPdfResetZoom()">↺ Reset</button>
                        </div>
                        
                        <!-- Contrôles de pagination -->
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <button style="background: #6c757d; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9em;" onclick="clientPdfPrevPage()" ${page <= 1 ? 'disabled' : ''}>⬅️ Précédent</button>
                            <span style="min-width: 80px; text-align: center; font-weight: bold;" id="client-page-info">Page ${page}/${totalPdfPages}</span>
                            <button style="background: #6c757d; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9em;" onclick="clientPdfNextPage()" ${page >= totalPdfPages ? 'disabled' : ''}>Suivant ➡️</button>
                        </div>
                    </div>
                </div>
            `;
            
        }
        
        function clientPdfZoomIn() {
            if (pdfZoomLevel < 200) {
                pdfZoomLevel += 10;
                console.log('🔍 Client Zoom IN:', pdfZoomLevel);
                if (socket && typeof socket.emit === 'function') {
                    console.log('📤 Envoi pdf-zoom-change:', pdfZoomLevel);
                    socket.emit('pdf-zoom-change', { zoom: pdfZoomLevel });
                } else {
                    console.warn('⚠️ Socket non disponible pour zoom');
                    renderPdfPage(currentPdfFile, currentPdfPage);
                }
            }
        }
        
        function clientPdfZoomOut() {
            if (pdfZoomLevel > 50) {
                pdfZoomLevel -= 10;
                console.log('🔍 Client Zoom OUT:', pdfZoomLevel);
                if (socket && typeof socket.emit === 'function') {
                    console.log('📤 Envoi pdf-zoom-change:', pdfZoomLevel);
                    socket.emit('pdf-zoom-change', { zoom: pdfZoomLevel });
                } else {
                    console.warn('⚠️ Socket non disponible pour zoom');
                    renderPdfPage(currentPdfFile, currentPdfPage);
                }
            }
        }
        
        function clientPdfResetZoom() {
            pdfZoomLevel = 100;
            console.log('🔍 Client Zoom RESET:', pdfZoomLevel);
            if (socket && typeof socket.emit === 'function') {
                console.log('📤 Envoi pdf-zoom-change:', pdfZoomLevel);
                socket.emit('pdf-zoom-change', { zoom: pdfZoomLevel });
            } else {
                console.warn('⚠️ Socket non disponible pour zoom');
                renderPdfPage(currentPdfFile, currentPdfPage);
            }
        }
        
        function clientPdfNextPage() {
            if (currentPdfPage < totalPdfPages) {
                console.log('📄 Client Next Page - envoi au serveur');
                if (socket && typeof socket.emit === 'function') {
                    console.log('📤 Envoi pdf-next-page');
                    socket.emit('pdf-next-page', {});
                } else {
                    console.warn('⚠️ Socket non disponible pour next');
                }
            }
        }
        
        function clientPdfPrevPage() {
            if (currentPdfPage > 1) {
                console.log('📄 Client Prev Page - envoi au serveur');
                if (socket && typeof socket.emit === 'function') {
                    console.log('📤 Envoi pdf-prev-page');
                    socket.emit('pdf-prev-page', {});
                } else {
                    console.warn('⚠️ Socket non disponible pour prev');
                }
            }
        }

        function afficherMedia(index) {
            const container = document.getElementById('media-container');
            if (medias.length === 0) {
                container.innerHTML = '<div id="no-media">Aucun média sélectionné</div>';
                return;
            }
            const media = medias[index];
            let html = '';
            if (media.nom.match(/\.(mp4|avi|mov|mkv|webm|flv|wmv)$/i)) {
                html = '<video autoplay muted loop style="width: 100%; height: 100%; object-fit: contain;"><source src="' + media.url + '" type="video/mp4"></video>';
            } else if (media.nom.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
                html = '<img src="' + media.url + '" style="width: 100%; height: 100%; object-fit: contain;">';
            } else if (media.nom.match(/\.pdf$/i)) {
                html = '<iframe src="' + media.url + '" style="width: 100%; height: 100%; border: none;"></iframe>';
            } else {
                html = '<div style="text-align: center; padding: 20px;">Fichier non supporté: ' + media.nom + '</div>';
            }
            container.innerHTML = html;
        }

        function scheduleNextMedia() {
            if (mediaInterval) {
                clearTimeout(mediaInterval);
                mediaInterval = null;
            }
            if (medias.length < 2) return;
            const current = medias[currentIndex];
            const delay = (current && Number(current.duration) > 0 ? Number(current.duration) : 10) * 1000;
            mediaInterval = setTimeout(() => {
                currentIndex = (currentIndex + 1) % medias.length;
                afficherMedia(currentIndex);
                scheduleNextMedia();
            }, delay);
        }

        function traiterMedias(data) {
            medias = data.medias || [];
            if (medias.length > 0) {
                currentIndex = 0;
                afficherMedia(currentIndex);
                scheduleNextMedia();
            } else {
                document.getElementById('media-container').innerHTML = '<div id="no-media">Aucun média sélectionné</div>';
                if (mediaInterval) {
                    clearTimeout(mediaInterval);
                    mediaInterval = null;
                }
            }
        }

        // Polling HTTP : détecte les redémarrages serveur et recharge la page automatiquement
        // Fonctionne même si le Pi a l'ancien client.html (pas besoin de WebSocket)
        let knownServerStartTime = null;
        setInterval(async () => {
            try {
                const res = await fetch('/api/server-time');
                const data = await res.json();
                if (knownServerStartTime === null) {
                    knownServerStartTime = data.startTime;
                } else if (knownServerStartTime !== data.startTime) {
                    console.log('🔄 [CLIENT] Serveur redémarré, rechargement...');
                    window.location.reload();
                }
            } catch { /* serveur indisponible, on réessaie dans 10s */ }
        }, 10000);

        socket = io(SERVER_URL);

        let isReconnecting = false;
        socket.on('connect', () => {
            if (isReconnecting) {
                // Le serveur a redémarré — recharger la page pour obtenir le HTML frais
                console.log('🔄 [CLIENT] Reconnexion détectée — rechargement de la page');
                window.location.reload();
                return;
            }
            console.log('Connecté au serveur WebSocket');
            socket.emit('register-display-client', { screenId });
        });

        socket.on('medias-list', (data) => {
            if (currentDisplayPage === 'documents') {
                traiterMedias(data);
            }
        });

        socket.on('display-page-changed', (data) => {
            if (data && data.page) {
                renderDisplayPage(data.page);
            }
        });

        socket.on('display-mode-changed', (data) => {
            if (data && data.mode) {
                renderDisplayPage(data.mode);
            }
        });

        socket.on('pdf-sync', (data) => {
            if (data) {
                const prevFile = currentPdfFile;
                const prevPage = currentPdfPage;

                currentPdfFile = data.file;
                currentPdfPage = data.page || 1;
                totalPdfPages = data.totalPages || 0;
                pdfZoomLevel = data.zoom || 100;

                // Effacer les annotations uniquement si le fichier ou la page change (pas le zoom)
                const pageChanged = prevFile !== currentPdfFile || prevPage !== currentPdfPage;
                if (pageChanged) {
                    clearAnnotationOverlay();
                }

                if (currentDisplayPage === 'documents' && currentPdfFile) {
                    renderPdfPage(currentPdfFile, currentPdfPage);
                }
            }
        });

        // Réception des traits en temps réel (coordonnées normalisées 0-1)
        socket.on('pdf-draw-start', (data) => {
            console.log('📩 [CLIENT] pdf-draw-start reçu', data ? `file:${data.file} page:${data.page}` : 'null',
                        '| local file:', currentPdfFile, 'page:', currentPdfPage);
            if (!data) return;
            // Si on connaît déjà le fichier/page courant, vérifier la correspondance
            if (currentPdfFile && (data.file !== currentPdfFile || parseInt(data.page) !== parseInt(currentPdfPage))) {
                console.warn('⚠️ [CLIENT] Trait ignoré — fichier/page ne correspondent pas',
                    `reçu: ${data.file}@${data.page} | local: ${currentPdfFile}@${currentPdfPage}`);
                return;
            }
            const canvas = getOrCreateAnnotationCanvas();
            // Mapper les coordonnées sur la zone PDF réelle (pas le window entier)
            const pdfRect = getPdfRect();
            const scale = pdfRect.height / 400;
            annotationCtx.strokeStyle = data.color || '#FF0000';
            annotationCtx.lineWidth = Math.max(2, (data.width || 3) * scale);
            prevStrokeX = pdfRect.left + data.x * pdfRect.width;
            prevStrokeY = pdfRect.top  + data.y * pdfRect.height;
            isReceivingStroke = true;
            drawPointCount = 0;
            // Point de départ visible
            annotationCtx.beginPath();
            annotationCtx.arc(prevStrokeX, prevStrokeY, Math.max(3, (data.width || 3) * scale), 0, Math.PI * 2);
            annotationCtx.fillStyle = data.color || '#FF0000';
            annotationCtx.fill();
            console.log('✏️ [CLIENT] Début trait — pdfRect', pdfRect.width.toFixed(0)+'x'+pdfRect.height.toFixed(0),
                'offset', pdfRect.left.toFixed(0)+','+pdfRect.top.toFixed(0),
                '| dot at', prevStrokeX.toFixed(0), prevStrokeY.toFixed(0));
        });

        socket.on('pdf-draw-point', (data) => {
            if (!isReceivingStroke || !annotationCtx || !annotationCanvas) return;
            const pdfRect = getPdfRect();
            const x = pdfRect.left + data.x * pdfRect.width;
            const y = pdfRect.top  + data.y * pdfRect.height;
            annotationCtx.beginPath();
            annotationCtx.moveTo(prevStrokeX, prevStrokeY);
            annotationCtx.lineTo(x, y);
            annotationCtx.stroke();
            prevStrokeX = x;
            prevStrokeY = y;
            drawPointCount++;
        });

        socket.on('pdf-draw-end', () => {
            isReceivingStroke = false;
            console.log('✅ [CLIENT] Trait reçu —', drawPointCount, 'point(s) dessiné(s)');
        });

        socket.on('pdf-clear-annotations', (data) => {
            if (data && data.file === currentPdfFile && data.page === currentPdfPage) {
                clearAnnotationOverlay();
            }
        });

        socket.on('client-reload', () => {
            console.log('🔄 [CLIENT] Rechargement forcé reçu — rechargement de la page...');
            window.location.reload();
        });

        socket.on('disconnect', () => {
            isReconnecting = true;
            console.log('Déconnecté du serveur WebSocket');
            document.getElementById('media-container').innerHTML = '<div id="no-media">Connexion perdue...</div>';
        });

        console.log('Client ' + screenId + ' connecté sur ' + baseUrl);
    </script>
</body>
</html>
